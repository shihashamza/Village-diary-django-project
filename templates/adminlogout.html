<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1abc9c,#2c3e50);
    padding:20px;
}

/* Login Card */
.login-box{
    background:white;
    padding:40px;
    width:350px;
    max-width:100%;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

.login-box h2{
    margin-bottom:20px;
    color:#2c3e50;
}

/* Inputs */
.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px 40px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

.input-box span{
    position:absolute;
    left:12px;
    top:12px;
    font-size:18px;
}

/* Options */
.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:8px;
}

.options a{
    text-decoration:none;
    color:#1abc9c;
}

/* Buttons */
button{
    width:100%;
    padding:12px;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

.login-btn{
    background:#1abc9c;
}

.login-btn:hover{
    background:#16a085;
}

/* Logout Box */
.logout-box{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #ddd;
}

.logout-btn{
    background:#e74c3c;
}

.logout-btn:hover{
    background:#c0392b;
}

/* ============ RESPONSIVE ============ */
@media (max-width:480px){
    .login-box{
        padding:28px 22px;
    }
    .login-box h2{
        font-size:19px;
    }
}

</style>
</head>

<body>

<div class="login-box">
    <h2>🥛 Dairy Admin Login</h2>

    <form>

        <div class="input-box">
            <span>👤</span>
            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <span>🔒</span>
            <input type="password" placeholder="Password">
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn">Login</button>

        <!-- Logout Section -->
        <div class="logout-box">
            <p>Already logged in?</p>
            <button class="logout-btn">Logout</button>
        </div>

    </form>
</div>

</body>
</html>
