<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
}

/* Layout */
.container{
    display:flex;
    min-height:100vh;
}

/* hidden checkbox that drives the mobile sidebar, no JS needed */
#sidebarToggle{
    display:none;
}

/* Sidebar (Same as other pages) */
.sidebar{
    width:260px;
    background:linear-gradient(180deg,#2c3e50,#1a252f);
    color:white;
    padding:25px 20px;
    position:fixed;
    height:100vh;
    overflow-y:auto;
    transition:transform 0.3s ease;
    z-index:1000;
}

.logo{
    text-align:center;
    margin-bottom:40px;
    font-size:22px;
}

.menu{
    list-style:none;
}

.menu li{
    margin-bottom:15px;
}

.menu li a{
    display:block;
    padding:12px 15px;
    border-radius:8px;
    text-decoration:none;
    color:#ecf0f1;
    transition:0.3s;
}

.menu li a:hover{
    background:#1abc9c;
    padding-left:20px;
}

.active{
    background:#1abc9c;
}

.logout{
    margin-top:25px;
    padding:12px;
    background:#e74c3c;
    text-align:center;
    border-radius:8px;
    cursor:pointer;
}

.logout:hover{
    background:#c0392b;
}

/* Main */
.main{
    margin-left:260px;
    padding:40px;
    width:100%;
}

/* Mobile top bar (hidden on desktop) */
.mobile-topbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#1a252f;
    color:white;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:999;
}

.mobile-topbar span{
    font-size:18px;
}

.sidebar-toggle-label{
    font-size:26px;
    cursor:pointer;
    line-height:1;
}

/* dark overlay behind sidebar when open, click to close needs no JS
   because the label covers the whole overlay area */
.sidebar-overlay{
    display:none;
}

/* Form Card */
.form-box{
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
    max-width:750px;
}

.form-box h2{
    margin-bottom:25px;
}

/* Inputs */
label{
    font-weight:600;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin:8px 0 18px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

textarea{
    height:120px;
    resize:none;
}

input:focus, textarea:focus, select:focus{
    outline:none;
    border:1px solid #1abc9c;
}

/* Button */
.btn{
    background:#1abc9c;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
    width:100%;
}

.btn:hover{
    background:#16a085;
}

.logout{
    margin-top:25px;
    padding:12px;
    background:#e74c3c;
    text-align:center;
    border-radius:8px;
    display:block;
    color:white;
}

.logout:hover{
    background:#c0392b;
}

/* ============ RESPONSIVE ============ */

@media (max-width:992px){
    .mobile-topbar{
        display:flex;
    }

    .sidebar{
        transform:translateX(-100%);
        top:0;
        left:0;
    }

    /* checkbox checked -> slide sidebar into view */
    #sidebarToggle:checked ~ .container .sidebar{
        transform:translateX(0);
    }

    /* overlay appears behind the sidebar once open, tapping it closes menu */
    #sidebarToggle:checked ~ .container .sidebar-overlay{
        display:block;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.4);
        z-index:900;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .form-box{
        padding:20px;
        max-width:100%;
    }
}

@media (max-width:480px){
    .form-box h2{
        font-size:19px;
    }

    .main{
        padding:15px;
    }
}
</style>
</head>

<body>

<input type="checkbox" id="sidebarToggle">

<!-- Mobile top bar with hamburger, only visible on small screens -->
<div class="mobile-topbar">
    <span>🥛 Dairy Admin</span>
    <label for="sidebarToggle" class="sidebar-toggle-label">&#9776;</label>
</div>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2 class="logo">🥛 Dairy Admin</h2>

        <ul class="menu">
            <li><a href="{% url 'admindashboard' %}">Dashboard</a></li>
            <li><a href="{% url 'adminproduct' %}">Products</a></li>
            <li><a href="{% url 'adminaddproduct' %}" class="active">Add Product</a></li>
            <li><a href="{% url 'admincategories' %}">Category</a></li>
            <li><a href="{% url 'adminorder' %}">Orders</a></li>
            <li><a href="{% url 'admincustomer' %}">Customers</a></li>
            <li><a href="{%url 'admincoupons'%}">Coupons</a></li>
            <li><a href="{% url 'adminbanner' %}">Banner</a></li>
            <li><a href="{% url 'adminnotification' %}">Notification</a></li>
            <li><a href="{% url 'adminlogout' %}" class="logout">Logout</a></li>
        </ul>
    </div>

    <!-- Overlay: tapping it (as a label) closes the sidebar with no JS -->
    <label for="sidebarToggle" class="sidebar-overlay"></label>

    <!-- Main -->
    <div class="main">

        <div class="form-box">
            <h2>Add New Product</h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <label>Product Name</label>
                <input type="text" name="name" placeholder="Enter product name" required>

                <label>Price (₹)</label>
                <input type="number" name="price" step="0.01" placeholder="Enter price" required>

                <label>Description</label>
                <textarea name="description" placeholder="Enter product description"></textarea>
                <label>Category</label>
                   <select name="category" required>
    <option value="">Select Category</option>
    {% for cat in categories %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
    {% endfor %}
</select>
                <label>Product Image 1</label>
                <input type="file" name="image1" required>

                <label>Product Image 2</label>
                <input type="file" name="image2">

                <label>Product Image 3</label>
                <input type="file" name="image3">

                <label>Product  Image 4</label>
                <input type="file" name="image4">

                <button type="submit" class="btn">Add Product</button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
