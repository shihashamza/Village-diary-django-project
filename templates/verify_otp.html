{% block content %}

<style>
.otp-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
    background:#f4f6f9;
}

.otp-card{
    background:white;
    padding:40px;
    width:400px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.otp-card h2{
    margin-bottom:20px;
    color:#2f3e2f;
}

.otp-card input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    text-align:center;
    font-size:18px;
    letter-spacing:5px;
}

.otp-btn{
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#28a745,#1e7e34);
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.otp-btn:hover{
    background:linear-gradient(135deg,#218838,#145c2a);
}
</style>

<div class="otp-container">
    <div class="otp-card">
        <h2>Verify OTP</h2>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text"
                   name="otp"
                   maxlength="6"
                   placeholder="Enter 6 Digit OTP"
                   required>

            <button type="submit" class="otp-btn">
                Verify
            </button>
        </form>
    </div>
</div>

{% endblock %}
