{% comment %} {% load static %}
{% block content %}

<style>
.reset-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
    background:#f4f6f9;
}

.reset-card{
    background:white;
    padding:40px;
    width:400px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.reset-card h2{
    margin-bottom:20px;
    color:#2f3e2f;
}

.reset-card input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

.reset-card input:focus{
    outline:none;
    border-color:#28a745;
    box-shadow:0 0 5px rgba(40,167,69,0.3);
}

.submit{
    margin-top:10px;
}

.submit-btn{
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#28a745,#1e7e34);
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s ease;
}

.submit-btn:hover{
    background:linear-gradient(135deg,#218838,#145c2a);
}

</style>

<div class="reset-container">
    <div class="reset-card">
        <h2>Forgot Password</h2>

        <form method="post">
            {% csrf_token %}
            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <div class="submit">
                <button type="submit" class="submit-btn">
                    Submit
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %} {% endcomment %} 


{% load static %}
{% block content %}

<style>
.reset-container {
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:70vh;
  background:#f4f6f9;
  padding:20px;
}

.reset-card {
  background:white;
  padding:30px 25px;
  width:100%;
  max-width:400px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.reset-card h2 {
  margin:0 0 20px;
  color:#2f3e2f;
  font-size:26px;
}

.reset-card input {
  width:100%;
  padding:12px;
  margin-bottom:20px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

.reset-card input:focus {
  outline:none;
  border-color:#28a745;
  box-shadow:0 0 5px rgba(40,167,69,0.3);
}

.submit {
  margin-top:10px;
}

.submit-btn {
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#28a745,#1e7e34);
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
  transition:0.3s ease;
}

.submit-btn:hover {
  background:linear-gradient(135deg,#218838,#145c2a);
}

/* Responsive adjustments */
@media (max-width: 480px) {
  .reset-container {
    min-height:60vh;
    padding:15px;
  }

  .reset-card {
    padding:25px 20px;
  }

  .reset-card h2 {
    font-size:22px;
  }

  .reset-card input {
    padding:10px;
    font-size:13px;
  }

  .submit-btn {
    padding:10px;
    font-size:14px;
  }
}
</style>

<div class="reset-container">
  <div class="reset-card">
    <h2>Forgot Password</h2>

    <form method="post">
      {% csrf_token %}
      <input type="email"
             name="email"
             placeholder="Enter Email"
             required>

      <div class="submit">
        <button type="submit" class="submit-btn">
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
