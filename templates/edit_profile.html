<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    width:500px;
    margin:60px auto;
    background:white;
    padding:30px 35px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    margin-bottom:25px;
    font-size:24px;
}

.form-group{
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-weight:600;
    font-size:14px;
}

input{
    width:100%;
    padding:10px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

button{
    width:100%;
    background:#7a614c;
    color:white;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#5e4937;
}
/* ============================= */
/* 📱 MOBILE RESPONSIVE */
/* ============================= */

@media (max-width: 768px){

.container{
    width:90%;
    margin:30px auto;
    padding:20px;
}

h2{
    font-size:20px;
    text-align:center;
}

/* INPUT */
input{
    font-size:13px;
    padding:10px;
}

/* BUTTON */
button{
    padding:10px;
    font-size:14px;
}

}

/* SMALL MOBILE */
@media (max-width: 480px){

.container{
    width:95%;
    padding:15px;
}

label{
    font-size:13px;
}

input{
    font-size:12px;
}

button{
    font-size:13px;
}

}
/* INPUT FOCUS EFFECT */
input:focus{
    border-color:#7a614c;
    outline:none;
    box-shadow:0 0 5px rgba(122,97,76,0.3);
}

/* BUTTON CLICK EFFECT */
button:active{
    transform:scale(0.97);
}

/* SMOOTH */
*{
    transition:0.2s ease;
}
</style>
</head>

<body>

<div class="container">
    <h2>Edit Profile</h2>

    <!-- ❌ enctype removed (no file upload needed) -->
    <form method="POST">
        {% csrf_token %}

        <!-- USERNAME -->
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" value="{{ request.user.username }}">
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ request.user.email }}">
        </div>

        <!-- PHONE -->
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ request.user.userprofile.phone }}">
        </div>

        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
