<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: #28a745;
            color: white;
            border-radius: 50%;
            line-height: 80px;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        h2 {
            margin: 10px 0;
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }

        .btn:hover {
            background: #218838;
        }

        .btn-secondary {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 18px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }

        .btn-secondary:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="box">

    <div class="icon">✔</div>

    <h2>Order Placed Successfully 🎉</h2>
    <p>Thank you! Your order will be delivered soon.</p>

    <a href="{% url 'home' %}" class="btn">Continue Shopping</a><br>
    <a href="{% url 'orders' %}" class="btn-secondary">View Orders</a>

</div>

</body>
</html>
