{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Payment Method</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(120deg, #e0eafc, #cfdef3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

/* Hide default radio */
input[type="radio"]{
    display:none;
}

/* Card style */
.option{
    display:block;
    padding:15px;
    margin-bottom:15px;
    border:2px solid #ddd;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    position:relative;
}

/* Hover effect */
.option:hover{
    border-color:#007bff;
    background:#f5f9ff;
}

/* Selected effect */
input[type="radio"]:checked + .option{
    border-color:#007bff;
    background:#eaf4ff;
}

/* Content inside option */
.option-content{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    font-size:22px;
}

.text{
    font-size:16px;
    color:#333;
}

/* Button */
button{
    width:100%;
    padding:12px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="container">
    <h2>Select Payment Method</h2>
    <form method="POST">
        <input type="hidden" name="product_id" value="{{ product.id }}">

        {% csrf_token %}

        <!-- Online Payment -->
        <input type="radio" id="online" name="payment_method" value="online" required>
        <label for="online" class="option">
            <div class="option-content">
                <span class="icon">💳</span>
                <span class="text">Online Payment (Card / UPI)</span>
            </div>
        </label>

        <!-- COD -->
        <input type="radio" id="cod" name="payment_method" value="cod" required>
        <label for="cod" class="option">
            <div class="option-content">
                <span class="icon">📦</span>
                <span class="text">Cash on Delivery</span>
            </div>
        </label>

        <button type="submit">Continue</button>
    </form>
</div>

</body>
</html>
